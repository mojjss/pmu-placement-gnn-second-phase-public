name: Software CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Software checks / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package
        run: python -m pip install -e .
      - name: Check Python syntax
        run: python -m compileall -q src scripts
      - name: Check CLI interfaces
        run: |
          pmu-gnn --help
          pmu-gnn --version
          pmu-gnn train --help
          pmu-gnn benchmark --help
      - name: Run software unit tests with synthetic inputs
        run: python -m unittest discover -s tests/software -v
